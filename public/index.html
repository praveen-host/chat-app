<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simple Chat</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#2f6fed">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/css/styles.css"></head><body>

<div id="auth" style="display:none">
  <div id="authBox">
    <h3>Simple Chat</h3>
    <input id="u" placeholder="Username" autocomplete="username" autocapitalize="none">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')authenticate('signin')">
    <button onclick="authenticate('signin')">Sign in</button>
    <button class="ghost" onclick="authenticate('signup')">Sign up</button>
    <div id="err" class="err"></div>
  </div>
</div>

<div id="app">
  <div id="side">
    <div id="sideHead"><div class="me" onclick="openProfile()" title="My profile"><span id="meAv"></span><b id="meName"></b></div>
      <span><button id="bellBtn" class="ghost" style="display:none" onclick="enablePush()">🔔 Alerts</button>
      <button class="ghost" onclick="logout()">Logout</button></span></div>
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="head">
      <button id="back" class="ghost" onclick="closeChat()">&larr;</button>
      <span id="peerAv" onclick="openPeerProfile()" style="cursor:pointer"></span>
      <div id="peerInfo" onclick="openPeerProfile()" style="cursor:pointer">
        <span id="peerName">Chat</span>
        <span id="peerStatus"></span>
      </div>
      <button id="voiceCallBtn" class="ghost" title="Voice call" onclick="startVoiceCall()">📞 Call</button>
      <button id="delBtn" class="danger" style="display:none" onclick="deleteChat()">Delete chat</button>
    </div>
    <div id="msgs"></div>
    <div id="preview"><div id="previewImg"></div><span style="flex:1;color:#777;font-size:13px">Photo ready to send (add a caption if you like)</span><button class="ghost" onclick="clearPending()">✕</button></div>
    <div id="replyBar"><div class="rbody"><div id="replyWho"></div><div id="replyText"></div></div><button class="ghost" onclick="cancelReply()">✕</button></div>
    <div id="form">
      <button class="ghost" onclick="$('file').click()" title="Attach photo">📎</button>
      <input id="file" type="file" accept="image/*" hidden onchange="pickImage(this)">
      <input id="text" placeholder="Type a message" autocomplete="off" onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">Send</button>
    </div>
  </div>
</div>

<div id="profile" class="overlay"><div class="sheet">
  <div class="sheetHead"><b>My profile</b><button class="ghost" onclick="closeProfile()">✕</button></div>
  <div class="center"><span id="pAv"></span>
    <div class="row"><button class="ghost" onclick="$('avFile').click()">Change photo</button><button class="ghost" id="avRemove" onclick="removeAvatar()">Remove</button></div></div>
  <input id="avFile" type="file" accept="image/*" hidden onchange="pickAvatar(this)">
  <label>Display name <small>(shown to other people)</small></label><input id="pDisplay" maxlength="50">
  <label>Full name</label><input id="pFull" maxlength="100" autocomplete="name">
  <label>About</label><input id="pAbout" maxlength="200" placeholder="A short status or bio">
  <label>Email <small>(private, only you see it)</small></label><input id="pEmail" type="email" maxlength="255" autocomplete="email">
  <label>Phone <small>(private, only you see it)</small></label><input id="pPhone" type="tel" maxlength="30" autocomplete="tel">
  <label>Username <small>(used to sign in, cannot change)</small></label><input id="pUser" disabled>
  <div id="pErr" class="err"></div>
  <button onclick="saveProfile()">Save</button>
</div></div>

<div id="peerProfile" class="overlay" onclick="closePeerProfile()"><div class="sheet" onclick="event.stopPropagation()">
  <div class="sheetHead"><b>Profile</b><button class="ghost" onclick="closePeerProfile()">✕</button></div>
  <div class="center"><span id="ppAv"></span><b id="ppName" style="font-size:18px"></b><span id="ppUser" style="color:#888"></span></div>
  <div class="pRow" id="ppFullRow"><span>Full name</span><div id="ppFull"></div></div>
  <div class="pRow" id="ppAboutRow"><span>About</span><div id="ppAbout"></div></div>
</div></div>

<div id="delDialog" class="overlay" onclick="closeDelete()"><div class="sheet small" onclick="event.stopPropagation()">
  <b>Delete message?</b>
  <button class="danger" id="delEveryone" onclick="confirmDelete(true)">Delete for everyone</button>
  <button class="ghost" onclick="confirmDelete(false)">Delete for me</button>
  <button class="ghost" onclick="closeDelete()">Cancel</button>
</div></div>

<div id="viewer" onclick="closeViewer()" oncontextmenu="return false">
  <div id="viewerImg"></div>
  <button id="viewerClose" onclick="closeViewer()">✕</button>
</div>
<div id="callOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="callTitle">
  <div class="sheet call-sheet">
    <div class="sheetHead"><b id="callTitle">Voice call</b><button class="ghost" onclick="endVoiceCall()" aria-label="Close call">✕</button></div>
    <div class="call-avatar" aria-hidden="true">☎</div>
    <div id="callStatus" role="status" aria-live="polite">Ready</div>
    <audio id="remoteCallAudio" autoplay></audio>
    <div class="call-actions">
      <button id="callAccept" onclick="acceptVoiceCall()">Accept</button>
      <button id="callReject" class="danger" onclick="rejectVoiceCall()">Decline</button>
      <button id="callMute" class="ghost" onclick="toggleCallMute()">Mute</button>
      <button id="callEnd" class="danger" onclick="endVoiceCall()">End call</button>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/core.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/avatars.js"></script>
<script src="/js/users.js"></script>
<script src="/js/profile.js"></script>
<script src="/js/messages.js"></script>
<script src="/js/attachments.js"></script>
<script src="/js/push.js"></script>
<script src="/js/socket.js"></script>
<script src="/js/calls.js"></script>
<script src="/js/main.js"></script></body></html>
